<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 348">
  <!--
    卡通座头鲸 v2 —— 以 codex imagegen 生成图为参考临摹的矢量版。
    部件分组对应骨骼引擎:
      body  = 整个躯干(圆顶+收窄的下身)+肚皮+雀斑,枢轴在地面线
      head  = 只放五官(眉/眼/腮红/嘴/喷水),浮在躯干上,转动即"看来看去",
              不拆躯干就没有接缝问题(描边风格拆躯干会露出重叠描边)
      armL/armR = 长胸鳍(座头鲸标志),footL/footR = 尾鳍左右瓣(共用尾根枢轴)
  -->

  <!-- 尾鳍:画在最底层,根部藏在躯干后面 -->
  <g id="footL">
    <path d="M 132 294 C 112 298, 90 306, 76 320 C 64 332, 70 342, 84 338 C 104 332, 122 320, 132 306 Z"
          fill="#8FB4E0" stroke="#22304F" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="92" cy="322" r="3.5" fill="#C6DBF2"/>
  </g>
  <g id="footR">
    <path d="M 128 294 C 148 298, 170 306, 184 320 C 196 332, 190 342, 176 338 C 156 332, 138 320, 128 306 Z"
          fill="#8FB4E0" stroke="#22304F" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="168" cy="322" r="3.5" fill="#C6DBF2"/>
  </g>

  <!-- 躯干:大头圆顶 + 向下收窄,倒水滴比例是可爱的关键 -->
  <g id="body">
    <path d="M 130 44 C 60 48, 24 106, 26 158 C 27 200, 44 230, 68 254 C 88 274, 104 292, 108 306 C 112 318, 148 318, 152 306 C 156 292, 172 274, 192 254 C 216 230, 233 200, 234 158 C 236 106, 200 48, 130 44 Z"
          fill="#8FB4E0" stroke="#22304F" stroke-width="6" stroke-linejoin="round"/>
    <!-- 肚皮:宽在上、收成尖的倒三角 + 喉腹褶(起始线压低,给嘴留出位置) -->
    <path d="M 64 204 C 95 190, 165 190, 196 204 C 184 250, 158 286, 130 294 C 102 286, 76 250, 64 204 Z"
          fill="#F7EFDC" stroke="#22304F" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 94 200 C 100 230, 110 262, 123 284" fill="none" stroke="#CBBFA4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 112 196 C 115 228, 122 264, 128 287" fill="none" stroke="#CBBFA4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 130 195 C 130 228, 130 264, 130 289" fill="none" stroke="#CBBFA4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 148 196 C 145 228, 138 264, 132 287" fill="none" stroke="#CBBFA4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 166 200 C 160 230, 150 262, 137 284" fill="none" stroke="#CBBFA4" stroke-width="3" stroke-linecap="round"/>
    <!-- 头顶两侧的浅色雀斑 -->
    <ellipse cx="78" cy="88" rx="4.5" ry="3.5" fill="#C6DBF2"/>
    <ellipse cx="92" cy="74" rx="3.5" ry="3" fill="#C6DBF2"/>
    <ellipse cx="66" cy="104" rx="3.5" ry="3" fill="#C6DBF2"/>
    <ellipse cx="182" cy="86" rx="4.5" ry="3.5" fill="#C6DBF2"/>
    <ellipse cx="196" cy="100" rx="3.5" ry="3" fill="#C6DBF2"/>
    <ellipse cx="168" cy="72" rx="3" ry="2.5" fill="#C6DBF2"/>
  </g>

  <!-- 五官层:整组即"头",转动/平移就是看来看去,不会露接缝 -->
  <g id="head">
    <!-- 喷水花 + 喷水孔 -->
    <circle cx="116" cy="24" r="6" fill="#BFE0F5" stroke="#22304F" stroke-width="4"/>
    <circle cx="130" cy="13" r="8" fill="#BFE0F5" stroke="#22304F" stroke-width="4"/>
    <circle cx="144" cy="24" r="6" fill="#BFE0F5" stroke="#22304F" stroke-width="4"/>
    <path d="M 122 41 Q 130 47 138 41" fill="none" stroke="#22304F" stroke-width="4" stroke-linecap="round"/>
    <!-- 眉毛 -->
    <path d="M 82 124 Q 95 116 108 124" fill="none" stroke="#22304F" stroke-width="4" stroke-linecap="round"/>
    <path d="M 152 124 Q 165 116 178 124" fill="none" stroke="#22304F" stroke-width="4" stroke-linecap="round"/>
    <!-- 大眼睛:白眼圈 + 深蓝大瞳孔 + 双高光 -->
    <circle cx="95" cy="148" r="22" fill="#FFFFFF" stroke="#22304F" stroke-width="5"/>
    <circle cx="97" cy="151" r="16" fill="#22304F"/>
    <circle cx="91" cy="144" r="6" fill="#FFFFFF"/>
    <circle cx="101" cy="157" r="2.8" fill="#FFFFFF"/>
    <circle cx="165" cy="148" r="22" fill="#FFFFFF" stroke="#22304F" stroke-width="5"/>
    <circle cx="163" cy="151" r="16" fill="#22304F"/>
    <circle cx="157" cy="144" r="6" fill="#FFFFFF"/>
    <circle cx="167" cy="157" r="2.8" fill="#FFFFFF"/>
    <!-- 腮红 + 微笑(腮红收进身体内侧,避开鳍) -->
    <ellipse cx="72" cy="176" rx="12" ry="7.5" fill="#F2A5B8" opacity="0.85"/>
    <ellipse cx="188" cy="176" rx="12" ry="7.5" fill="#F2A5B8" opacity="0.85"/>
    <path d="M 118 184 Q 130 194 142 184" fill="none" stroke="#22304F" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 长胸鳍:外缘平滑、内侧一道奶油色饰边(参考图的帧边风格) -->
  <g id="armL">
    <path d="M 52 196 C 30 214, 16 262, 20 304 C 22 320, 34 322, 44 312 C 62 292, 70 248, 68 208 C 67 198, 58 192, 52 196 Z"
          fill="#A9C6EA" stroke="#22304F" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 57 212 C 55 250, 48 286, 36 304" fill="none" stroke="#F2EBD8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="40" cy="234" r="3" fill="#C6DBF2"/>
  </g>
  <g id="armR">
    <path d="M 208 196 C 230 214, 244 262, 240 304 C 238 320, 226 322, 216 312 C 198 292, 190 248, 192 208 C 193 198, 202 192, 208 196 Z"
          fill="#A9C6EA" stroke="#22304F" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 203 212 C 205 250, 212 286, 224 304" fill="none" stroke="#F2EBD8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="220" cy="234" r="3" fill="#C6DBF2"/>
  </g>
</svg>
